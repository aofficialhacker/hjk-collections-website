<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - HJKCollections</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/components.css" rel="stylesheet">
    <link href="assets/css/customer.css" rel="stylesheet">
    <link href="assets/css/responsive.css" rel="stylesheet">
</head>
<body>

<header id="header"></header>

<div class="container-custom">
    <div id="breadcrumbs" class="mb-4"></div>
    <div id="pageContent"></div>
</div>

<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {

    // ✅ WAIT until app fully loads (IMPORTANT FIX)
    while (!HJKApp._ready) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }

    const settings = HJKApp.getSettings() || {};

    // Breadcrumbs
    document.getElementById('breadcrumbs').innerHTML =
        HJKComponents.renderBreadcrumbs([
            { label: 'Home', url: 'index.html' },
            { label: 'Contact Us' }
        ]);

    // Page Content
    document.getElementById('pageContent').innerHTML = `
        <div class="content-card">

            <!-- Heading -->
            <div class="text-center mb-5">
                <h1 class="font-heading" style="font-size:2.2rem;color:var(--primary)">
                    Contact Us
                </h1>
                <p class="text-muted" style="max-width:600px;margin:auto">
                    Have a question or feedback? We'd love to hear from you.
                </p>
            </div>

            <!-- Contact Info -->
            <div class="row g-4 mb-5">
                
                <div class="col-md-4">
                    <div class="contact-info-card text-center p-4">
                        <i class="fa-solid fa-location-dot fa-2x mb-3 text-primary"></i>
                        <h6>Our Address</h6>
                        <p class="text-muted">
                            ${settings.address || 'Your Address Here'}
                        </p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="contact-info-card text-center p-4">
                        <i class="fa-solid fa-phone fa-2x mb-3 text-primary"></i>
                        <h6>Phone</h6>
                        <p class="text-muted">
                            ${settings.phone || '+91 XXXXX XXXXX'}
                            ${settings.whatsapp ? `<br>WhatsApp: ${settings.whatsapp}` : ''}
                        </p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="contact-info-card text-center p-4">
                        <i class="fa-solid fa-envelope fa-2x mb-3 text-primary"></i>
                        <h6>Email</h6>
                        <p class="text-muted">
                            ${settings.email || 'info@yourdomain.com'}
                        </p>
                    </div>
                </div>

            </div>

            <!-- Form + Map -->
            <div class="row g-5">

                <!-- Contact Form -->
                <div class="col-md-7">
                    <h3 class="font-heading mb-4">Send us a Message</h3>

                    <form onsubmit="handleContactForm(event)">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label>Full Name *</label>
                                <input type="text" id="contactName" class="form-control-custom" required>
                            </div>
                            <div class="col-md-6">
                                <label>Email *</label>
                                <input type="email" id="contactEmail" class="form-control-custom" required>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label>Phone</label>
                            <input type="tel" id="contactPhone" class="form-control-custom">
                        </div>

                        <div class="mt-3">
                            <label>Subject *</label>
                            <select id="contactSubject" class="form-control-custom" required>
                                <option value="">Select</option>
                                <option value="general">General</option>
                                <option value="order">Order</option>
                                <option value="product">Product</option>
                                <option value="return">Return</option>
                                <option value="feedback">Feedback</option>
                            </select>
                        </div>

                        <div class="mt-3">
                            <label>Message *</label>
                            <textarea id="contactMessage" rows="5" class="form-control-custom" required></textarea>
                        </div>

                        <button class="btn-primary-custom mt-3">
                            <i class="fa-solid fa-paper-plane"></i> Send Message
                        </button>

                    </form>
                </div>

                <!-- Map -->
                <div class="col-md-5">
                    <h3 class="font-heading mb-4">Find Us</h3>

                    <iframe 
                        src="${settings.mapUrl || 'https://www.google.com/maps?q=Mumbai&output=embed'}"
                        width="100%" height="350"
                        style="border:0;border-radius:10px"
                        loading="lazy">
                    </iframe>

                    <!-- Business Hours -->
                    <div class="mt-4">
                        <h6>Business Hours</h6>
                        <div class="d-flex justify-content-between"><span>Mon-Fri</span><span>9AM - 8PM</span></div>
                        <div class="d-flex justify-content-between"><span>Sat</span><span>10AM - 6PM</span></div>
                        <div class="d-flex justify-content-between"><span>Sun</span><span>Closed</span></div>
                    </div>

                </div>

            </div>

        </div>
    `;
});


// Form Handler
async function handleContactForm(e) {
    e.preventDefault();

    const form = e.target;
    const name = document.getElementById('contactName').value.trim();
    const email = document.getElementById('contactEmail').value.trim();
    const phone = document.getElementById('contactPhone').value.trim();
    const subject = document.getElementById('contactSubject').value;
    const message = document.getElementById('contactMessage').value.trim();

    if (!name || !email || !subject || !message) {
        HJKComponents.showToast('Please fill all required fields', 'error');
        return;
    }

    const btn = form.querySelector('button[type="submit"], .btn-primary-custom');
    const originalText = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...'; }

    try {
        const res = await HJKAPI.contact.send({ name, email, phone, subject, message });
        HJKComponents.showToast(res.message || 'Message sent successfully!', 'success');
        form.reset();
    } catch (err) {
        HJKComponents.showToast(err.message || 'Failed to send message. Please try again.', 'error');
    } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = originalText; }
    }
}
</script>

</body>
</html>
